---
layout: compress
---

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" sizes="192x192" href="/favicon.ico">
    <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href={{ "assets/style/style.css" | relative_url }}>
    <script src={{"assets/script/main.js" | relative_url }} defer></script>
    <!-- {{page.url}} -->
    {% if page.tagline %}
      {% seo title=false %}
      <title>{{page.title}} - {{page.tagline}} | {{site.title}}</title>
    {% else %}
      {% seo %}
    {% endif %}
    {% include custom-seo.html %}
    {% include ads.html %}
</head>

<body>
    <header>
        {% include navbar.html %}
    </header>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <main class="col-12 col-xl-10 site-sheet">
                {{ content }}
            </main>
        </div>
    </div>
    {% include footer.html %}
    {% include tracking.html %}
    <link href="https://x.com/opensourcefeed" rel="me">
</body>

</html>
